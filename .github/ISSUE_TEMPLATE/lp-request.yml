name: LPのリクエスト
description: こんなサービスのLPを見てみたい、を書いておくと、だれかが作ってくれるかもしれません
title: "LPのリクエスト: "
labels: ["lp-request"]
body:
  - type: textarea
    id: idea
    attributes:
      label: どんなサービスか
      description: ポータルの一覧にそのまま出ます。1〜2文で書いてください
      placeholder: 例：飼っている猫の気持ちを、毎朝1行の天気予報にして届けるサービス
    validations:
      required: true
  - type: dropdown
    id: era
    attributes:
      label: いつごろの未来のサービスか
      description: ポータルの年表で、この時代のところに並びます
      options:
        - 2030年代
        - 2040年代
        - 2050年代
        - 2070年ごろ
        - 2100年ごろ
        - 2200年ごろ
        - もっと先
        - わからない
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: だれのためのサービスか
      placeholder: 例：ひとり暮らしで猫を飼っている人
  - type: textarea
    id: more
    attributes:
      label: ほかに伝えたいこと
      description: 雰囲気、参考にしたいサイト、入れてほしい言葉など
  - type: markdown
    attributes:
      value: |
        面白そうと思った人は、このIssueのいちばん上の書きこみに、親指のマークで反応してください。ポータルに「面白そう」の数として出ます。

        作りはじめる人は、このIssueに一言書いてください。LPができたら、ポータルの`lps.json`に足して、このIssueを閉じます。閉じると、ポータルのリクエストの一覧から消えます。
