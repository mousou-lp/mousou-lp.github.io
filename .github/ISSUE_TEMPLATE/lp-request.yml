name: LPのリクエスト
description: こんなサービスのLPを見てみたい、を書いておくと、だれかが作ってくれるかもしれません
title: "LPのリクエスト: "
labels: ["lp-request"]
body:
  - type: textarea
    id: idea
    attributes:
      label: どんなサービスか
      description: ポータルの一覧にそのまま出ます。1〜2文で書いてください
      placeholder: 例：飼っている猫の気持ちを、毎朝1行の天気予報にして届けるサービス
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: だれのためのサービスか
      placeholder: 例：ひとり暮らしで猫を飼っている人
  - type: textarea
    id: more
    attributes:
      label: ほかに伝えたいこと
      description: 雰囲気、参考にしたいサイト、入れてほしい言葉など
  - type: markdown
    attributes:
      value: |
        作りはじめる人は、このIssueに一言書いてください。LPができたら、ポータルの`lps.json`に足して、このIssueを閉じます。閉じると、ポータルのリクエストの一覧から消えます。
